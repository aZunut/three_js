<!doctype html>
<html>
<head>
  <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-super-hands-component/dist/aframe-super-hands-component.min.js"></script>
  <script src="https://cdn.rawgit.com/donmccurdy/aframe-physics-system/v4.0.1/dist/aframe-physics-system.min.js"></script>
</head>
<body>
  <a-scene vr-mode-ui="enabled: true" renderer="antialias: true" physics="gravity: 0 -9.8 0" embedded>
    <a-box id="startButton" 
       position="-0.3 1.5 -1" 
       depth="0.1" height="0.2" width="0.6"
       color="#4CAF50"
       event-set__enter="_event: click; _target: #statusText; text.value: 計測中！"
       class="clickable">
      <a-text value="計測開始" align="center" color="#fff" position="0 0 0.06"></a-text>
    </a-box>
  
    <a-box id="stopButton" 
       position="0.5 1.5 -1" 
       depth="0.1" height="0.2" width="0.6"
       color="#F44336"
       event-set__enter="_event: click; _target: #statusText; text.value: 停止中"
       class="clickable">
      <a-text value="計測終了" align="center" color="#fff" position="0 0 0.06"></a-text>
    </a-box>
    
    <a-text id="statusText" value="停止中" position="0 2 -1" color="yellow"></a-text>

    <!-- カメラ -->
    <a-entity camera look-controls position="0 1.6 0">
      <a-entity cursor="fuse: true; fuseTimeout: 500"
                position="0 0 -1"
                geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                material="color: cyan; shader: flat">
      </a-entity>
    </a-entity>

    <!-- 手のトラッキング -->
    <a-entity hand-tracking-controls="hand: left"
          super-hands
          physics-collider
          collider-check></a-entity>

    <a-entity hand-tracking-controls="hand: right"
          super-hands
          physics-collider
          collider-check></a-entity> 

    <!-- 座標表示 -->
    <a-entity id="finger-text" text="value: Loading...; color: yellow;" position="0 2 -3"></a-entity>

    <script>
      let time_data = new Date();
      let year = time_data.getFullYear();
      let month = time_data.getMonth() + 1;
      let day = time_data.getDate();
      let hour = time_data.getHours();
      let minute = time_data.getMinutes();
      let second = time_data.getSeconds();
      let filename = "download.csv";
      let trigger = false;
      let hand_list = ["wrist",
                      "thumb-metacarpal",
                      "thumb-phalanx-proximal",
                      "thumb-phalanx-distal",
                      "thumb-tip",
                      "index-finger-metacarpal",
                      "index-finger-phalanx-proximal",
                      "index-finger-phalanx-intermediate",
                      "index-finger-phalanx-distal",
                      "index-finger-tip",
                      "middle-finger-metacarpal",
                      "middle-finger-phalanx-proximal",
                      "middle-finger-phalanx-intermediate",
                      "middle-finger-phalanx-distal",
                      "middle-finger-tip",                        
                      "ring-finger-metacarpal",
                      "ring-finger-phalanx-proximal",
                      "ring-finger-phalanx-intermediate",
                      "ring-finger-phalanx-distal",
                      "ring-finger-tip",                        
                      "pinky-finger-metacarpal",
                      "pinky-finger-phalanx-proximal",
                      "pinky-finger-phalanx-intermediate",
                      "pinky-finger-phalanx-distal",
                      "pinky-finger-tip"]; //取得可能な座標点一覧

      document.querySelector('#startButton').addEventListener('click', () => {
        trigger = true;
        console.log("計測スタート！");
        // 必要なら計測開始時の初期化もここで
      });
      
      document.querySelector('#stopButton').addEventListener('click', () => {
        trigger = false;
        console.log("計測ストップ！");
        // 計測データ保存処理もここで呼び出せる
      });

      AFRAME.registerComponent('update-finger-position', {
        tick: function () {
          const hand = document.querySelector('[hand-tracking-controls]'); //あるクラスに一致する最初の要素を探索する
          if (hand && hand.object3D) {
            const finger = hand.object3D.getObjectByName('index-finger-tip'); //Three.js特有の要素、プロパティに一致する文字列を探索する
            if (finger) {
              const pos = finger.getWorldPosition(new THREE.Vector3()); //三次元座標の取得
              const textEntity = document.getElementById('finger-text'); //idプロパティで指定された文字列に一致する要素を探索
              textEntity.setAttribute('text', `value: X: ${pos.x.toFixed(3)} Y: ${pos.y.toFixed(3)} Z: ${pos.z.toFixed(3)}; color: yellow;`); //変更後のテキストをセット
              textEntity.setAttribute('position', `${pos.x.toFixed(3)} ${pos.y.toFixed(3)} ${pos.z.toFixed(3)+0.01}`); //変更後のテキストをセット
            }
          }
        }
      });

      AFRAME.registerComponent('recording_axis',{
        init: function(){
          window.addEventListener('keydown',
          event => {
        let keys = event.key;
                 alert(`${keys}`+'が押されました');
          });
          if (event.key == 's'){
            trigger = true;
            time_data = new Date();
            year = time_data.getFullYear();
            month = time_data.getMonth()+1;
            day = time_data.getDate();
            hour = time_data.getHours();
            minute = time_data.getMinutes();
            second = time_date.getSeconds();
            filename = `${year}${month}${day}${hour}${minute}${second}.csv`;
            let header = "time";
            hand_list.forEach(joint => {
              header += `,${joint}_x,${joint}_y,${joint}_z`;
            });
            records.push(header);
          }
          else if (event.key == 'e'){
            trigger = false;
            const csvContent = records.join("\n");
            const blob = new Blob([csvContent], { type: "text/csv" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
          }
        },
        tick: function(){
          if (trigger) {
            const hand = document.querySelector('[hand-tracking-controls]');
            if (hand && hand.object3D) {
              let now = new Date();
              let time = `${now.getHours()}:${now.getMinutes()}:${now.getSeconds()}.${now.getMilliseconds()}`;
              let row = `${time}`;
              hand_list.forEach(jointName => {
                const joint = hand.object3D.getObjectByName(jointName);
                if (joint) {
                  const pos = joint.getWorldPosition(new THREE.Vector3());
                  row += `,${pos.x.toFixed(5)},${pos.y.toFixed(5)},${pos.z.toFixed(5)}`;
                } else {
                  row += `,NaN,NaN,NaN`;
                }
              });
              records.push(row);
            }
          }
        }
      });
    </script>

    <!-- 更新コンポーネント適用 -->
    <a-entity update-finger-position></a-entity>
  </a-scene>
</body>
</html>
